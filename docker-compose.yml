# 完整部署编排：主应用 + MCP 服务 + Nginx（Milvus 复用 vector-database.yml）
#
# 启动顺序（先起 Milvus，它会创建名为 milvus 的共享网络）：
#   1) docker compose -f vector-database.yml up -d
#   2) docker compose up -d --build
# 或直接运行 deploy/deploy.sh 一键完成。

services:
  app:
    build: .
    container_name: aiopsagent-app
    restart: unless-stopped
    environment:
      # 容器内服务发现：覆盖本地开发用的 localhost 默认值
      MILVUS_HOST: milvus-standalone
      MILVUS_PORT: 19530
      MCP_CLS_URL: http://cls-server:8003/mcp
      MCP_MONITOR_URL: http://monitor-server:8004/mcp
      # 密钥从宿主机 .env 注入（不写入镜像）
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen-max}
      DASHSCOPE_EMBEDDING_MODEL: ${DASHSCOPE_EMBEDDING_MODEL:-text-embedding-v4}
      # 生产加固：按需开启鉴权（默认关闭）
      API_AUTH_ENABLED: ${API_AUTH_ENABLED:-false}
      API_AUTH_KEY: ${API_AUTH_KEY:-}
      # Harness 后端（多 worker 时切 redis；默认 in_process 不连 Redis）
      HARNESS_BACKEND: ${HARNESS_BACKEND:-in_process}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data          # 会话持久化（SQLite checkpointer）
      - ./uploads:/app/uploads    # 上传文件
    expose:
      - "9900"
    depends_on:
      - cls-server
      - monitor-server
      - redis
    networks:
      - app-net
      - milvus

  cls-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: aiopsagent-cls
    restart: unless-stopped
    command: ["python", "mcp_servers/cls_server.py"]
    environment:
      MCP_HOST: 0.0.0.0   # 容器内必须绑定 0.0.0.0 才能被 app 访问
      TENCENTCLOUD_SECRET_ID: ${TENCENTCLOUD_SECRET_ID:-}
      TENCENTCLOUD_SECRET_KEY: ${TENCENTCLOUD_SECRET_KEY:-}
      TENCENTCLOUD_REGION: ${TENCENTCLOUD_REGION:-ap-guangzhou}
    volumes:
      - ./mcp_servers/data:/app/mcp_servers/data   # 本地导入的数据集（可选）
    expose:
      - "8003"
    networks:
      - app-net

  monitor-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: aiopsagent-monitor
    restart: unless-stopped
    command: ["python", "mcp_servers/monitor_server.py"]
    environment:
      MCP_HOST: 0.0.0.0
    volumes:
      - ./mcp_servers/data:/app/mcp_servers/data
    expose:
      - "8004"
    networks:
      - app-net

  # 可选：Harness 后端（仅当 HARNESS_BACKEND=redis 时被 app 使用）
  redis:
    image: redis:7-alpine
    container_name: aiopsagent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    expose:
      - "6379"
    networks:
      - app-net

  nginx:
    image: nginx:1.27-alpine
    container_name: aiopsagent-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-net

networks:
  app-net:
    name: aiopsagent
  milvus:
    external: true
    name: milvus
