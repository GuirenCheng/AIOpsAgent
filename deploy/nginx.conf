# AIOpsAgent 反向代理（挂载到 /etc/nginx/conf.d/default.conf）
#
# 关键点：chat 接口使用 SSE 流式输出，必须关闭 proxy_buffering，
# 否则回复会被 Nginx 攒到缓冲区，全部生成完才一次性返回（表现为"卡住"）。

server {
    listen 80;
    server_name _;

    # 文档上传大小上限
    client_max_body_size 50m;

    location / {
        proxy_pass http://app:9900;

        # SSE 流式输出必需
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}

# 扩展：HTTPS 可另起一个 server 块（listen 443 ssl; 配证书），
# 以及用 location /static/ 直接由 Nginx 服务静态文件以减轻应用负载。
