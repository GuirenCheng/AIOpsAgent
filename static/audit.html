<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>审计与监控大盘 · AIOps Agent</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Cpath d='M12 5l2.1 4.9L19 12l-4.9 2.1L12 19l-2.1-4.9L5 12l4.9-2.1z' fill='white'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #0f1115;
            --panel: #171a21;
            --border: #2a2f3a;
            --text: #e6e8ee;
            --text-dim: #9aa3b2;
            --accent: #6366f1;
            --green: #22c55e;
            --red: #ef4444;
            --orange: #f59e0b;
            --yellow: #eab308;
            --purple: #a855f7;
        }
        :root[data-theme="light"] {
            --bg: #f4f5f9;
            --panel: #ffffff;
            --border: #e2e5ec;
            --text: #1a1d26;
            --text-dim: #5b6472;
            --accent: #6366f1;
            --green: #16a34a;
            --red: #dc2626;
            --orange: #d97706;
            --yellow: #ca8a04;
            --purple: #9333ea;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            padding: 24px;
            min-height: 100vh;
        }
        a { color: var(--accent); }
        .topbar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        .topbar h1 { font-size: 20px; font-weight: 600; }
        .topbar .sub { color: var(--text-dim); font-size: 13px; }
        .topbar .spacer { flex: 1; }
        .topbar a.back { font-size: 13px; text-decoration: none; }

        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }
        .card .label { color: var(--text-dim); font-size: 12px; margin-bottom: 6px; }
        .card .value { font-size: 26px; font-weight: 700; }
        .card .value.good { color: var(--green); }
        .card .value.bad { color: var(--red); }
        .card .value.warn { color: var(--orange); }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 16px;
        }
        .toolbar label { font-size: 12px; color: var(--text-dim); }
        select, input {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px 10px;
            font-size: 13px;
        }
        select:focus, input:focus { outline: 1px solid var(--accent); }
        .btn {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 13px;
            cursor: pointer;
        }
        .btn:hover { opacity: .9; }
        .auto-label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); cursor: pointer; }

        .table-wrap {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: auto;
        }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
        th { color: var(--text-dim); font-weight: 500; font-size: 12px; position: sticky; top: 0; background: var(--panel); }
        tr:last-child td { border-bottom: none; }
        td.args, td.error { white-space: normal; max-width: 320px; word-break: break-all; color: var(--text-dim); }
        .badge {
            display: inline-block;
            padding: 2px 9px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 500;
        }
        .badge.success { background: rgba(34,197,94,.15); color: var(--green); }
        .badge.error { background: rgba(239,68,68,.15); color: var(--red); }
        .badge.timeout { background: rgba(239,68,68,.15); color: var(--red); }
        .badge.rollback_failed, .badge.rollback_skipped { background: rgba(239,68,68,.15); color: var(--red); }
        .badge.rollback_required, .badge.rollback_executed { background: rgba(168,85,247,.15); color: var(--purple); }
        .badge.approval_expired { background: rgba(245,158,11,.15); color: var(--orange); }
        .badge.approval_denied { background: rgba(234,179,8,.15); color: var(--yellow); }
        .badge.approval_approved { background: rgba(34,197,94,.15); color: var(--green); }
        .badge.pending_approval { background: rgba(234,179,8,.15); color: var(--yellow); }
        .badge.overloaded, .badge.conflict { background: rgba(245,158,11,.15); color: var(--orange); }
        .badge.default { background: rgba(154,163,178,.15); color: var(--text-dim); }

        .empty { padding: 40px; text-align: center; color: var(--text-dim); }
        .meta { color: var(--text-dim); font-size: 12px; margin: 8px 2px 16px; }
    </style>
    <script>
        (function () {
            var t = localStorage.getItem('aiops-theme-v2') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body>
    <div class="topbar">
        <h1>审计与监控大盘</h1>
        <span class="sub">工具调用审计 · 异常监控</span>
        <span class="spacer"></span>
        <a class="back" href="/">← 返回对话</a>
    </div>

    <div class="cards">
        <div class="card"><div class="label">总调用数</div><div class="value" id="cTotal">–</div></div>
        <div class="card"><div class="label">成功</div><div class="value good" id="cSuccess">–</div></div>
        <div class="card"><div class="label">异常</div><div class="value warn" id="cAnomaly">–</div></div>
        <div class="card"><div class="label">回滚失败</div><div class="value bad" id="cRollbackFail">–</div></div>
        <div class="card"><div class="label">审批超时</div><div class="value warn" id="cApprovalTimeout">–</div></div>
    </div>

    <div class="toolbar">
        <label>状态</label>
        <select id="fStatus">
            <option value="">全部</option>
            <option value="success">success</option>
            <option value="error">error</option>
            <option value="timeout">timeout</option>
            <option value="rollback_required">rollback_required</option>
            <option value="rollback_executed">rollback_executed</option>
            <option value="rollback_failed">rollback_failed</option>
            <option value="rollback_skipped">rollback_skipped</option>
            <option value="pending_approval">pending_approval</option>
            <option value="approval_approved">approval_approved</option>
            <option value="approval_denied">approval_denied</option>
            <option value="approval_expired">approval_expired</option>
            <option value="overloaded">overloaded</option>
            <option value="conflict">conflict</option>
        </select>
        <label>工具</label>
        <input id="fTool" type="text" placeholder="如 restart_service">
        <label>服务器</label>
        <input id="fServer" type="text" placeholder="如 monitor">
        <label>时间范围</label>
        <select id="fSince">
            <option value="0">全部</option>
            <option value="15">最近 15 分钟</option>
            <option value="60">最近 1 小时</option>
            <option value="240">最近 4 小时</option>
            <option value="1440">最近 24 小时</option>
        </select>
        <label>条数</label>
        <select id="fLimit">
            <option value="50">50</option>
            <option value="100" selected>100</option>
            <option value="200">200</option>
            <option value="500">500</option>
        </select>
        <button class="btn" id="refreshBtn">刷新</button>
        <label class="auto-label"><input type="checkbox" id="autoRefresh"> 自动刷新(15s)</label>
    </div>

    <div class="meta" id="meta">加载中…</div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>时间</th>
                    <th>状态</th>
                    <th>工具</th>
                    <th>服务器</th>
                    <th>request_id</th>
                    <th>耗时(ms)</th>
                    <th>参数</th>
                    <th>错误 / 备注</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="empty" style="display:none;">暂无记录</div>
    </div>

    <script>
        const API_AUTH_KEY = window.API_AUTH_KEY || '';
        const STATUS_BADGE = new Set([
            'success', 'error', 'timeout', 'rollback_required', 'rollback_executed',
            'rollback_failed', 'rollback_skipped', 'pending_approval', 'approval_approved',
            'approval_denied', 'approval_expired', 'overloaded', 'conflict',
        ]);

        async function api(path) {
            const headers = {};
            if (API_AUTH_KEY) headers['X-API-Key'] = API_AUTH_KEY;
            const resp = await fetch(path, { headers });
            return resp.json();
        }

        function badge(status) {
            return STATUS_BADGE.has(status) ? status : 'default';
        }

        function esc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function fmtTime(ts) {
            if (!ts) return '-';
            const d = new Date(ts);
            if (isNaN(d.getTime())) return esc(ts);
            return d.toLocaleString('zh-CN', { hour12: false });
        }

        async function loadSummary() {
            try {
                const body = await api('/api/harness/audit/summary');
                const data = (body && body.data) || {};
                const counts = data.status_counts || {};
                const total = Object.values(counts).reduce((a, b) => a + b, 0);
                const success = counts.success || 0;
                const rollbackFail = (counts.rollback_failed || 0) + (counts.rollback_skipped || 0);
                const approvalTimeout = counts.approval_expired || 0;
                document.getElementById('cTotal').textContent = total;
                document.getElementById('cSuccess').textContent = success;
                document.getElementById('cAnomaly').textContent = total - success;
                document.getElementById('cRollbackFail').textContent = rollbackFail;
                document.getElementById('cApprovalTimeout').textContent = approvalTimeout;
            } catch (e) {
                console.error('加载汇总失败', e);
            }
        }

        async function loadList() {
            const params = new URLSearchParams();
            const status = document.getElementById('fStatus').value;
            const tool = document.getElementById('fTool').value.trim();
            const server = document.getElementById('fServer').value.trim();
            const since = document.getElementById('fSince').value;
            const limit = document.getElementById('fLimit').value;
            if (status) params.set('status', status);
            if (tool) params.set('tool', tool);
            if (server) params.set('server', server);
            if (since !== '0') params.set('since_minutes', since);
            params.set('limit', limit);

            const tbody = document.getElementById('tbody');
            const empty = document.getElementById('empty');
            const meta = document.getElementById('meta');
            try {
                const body = await api('/api/harness/audit?' + params.toString());
                const data = (body && body.data) || {};
                const items = data.items || [];
                meta.textContent = '共 ' + (data.count || items.length) + ' 条记录';
                tbody.innerHTML = '';
                empty.style.display = items.length ? 'none' : 'block';
                for (const r of items) {
                    const tr = document.createElement('tr');
                    tr.innerHTML =
                        '<td>' + fmtTime(r.ts) + '</td>' +
                        '<td><span class="badge ' + badge(r.status) + '">' + esc(r.status) + '</span></td>' +
                        '<td>' + esc(r.tool) + '</td>' +
                        '<td>' + esc(r.server || '-') + '</td>' +
                        '<td>' + esc((r.request_id || '-').slice(0, 12)) + '</td>' +
                        '<td>' + esc(r.duration_ms) + '</td>' +
                        '<td class="args">' + esc(r.args) + '</td>' +
                        '<td class="error">' + esc(r.error || '') + '</td>';
                    tbody.appendChild(tr);
                }
            } catch (e) {
                console.error('加载列表失败', e);
                meta.textContent = '加载失败：' + e.message;
            }
        }

        async function refresh() {
            await Promise.all([loadSummary(), loadList()]);
        }

        document.getElementById('refreshBtn').addEventListener('click', refresh);
        document.getElementById('fStatus').addEventListener('change', loadList);
        document.getElementById('fSince').addEventListener('change', loadList);
        document.getElementById('fLimit').addEventListener('change', loadList);
        document.getElementById('fTool').addEventListener('change', loadList);
        document.getElementById('fServer').addEventListener('change', loadList);

        let timer = null;
        document.getElementById('autoRefresh').addEventListener('change', function () {
            if (this.checked) {
                timer = setInterval(refresh, 15000);
            } else if (timer) {
                clearInterval(timer);
                timer = null;
            }
        });

        refresh();
    </script>
</body>
</html>
